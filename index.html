    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pharma_resist_theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
